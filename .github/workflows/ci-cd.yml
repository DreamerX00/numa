name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'

jobs:
  lint-and-format:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run ESLint
        run: npm run lint

      - name: 🔍 Check TypeScript
        run: npm run type-check

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test
        env:
          CI: true

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build
        env:
          # Mock environment variables for build (CI/CD)
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/numa-test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'mock-secret-for-ci-cd-testing-only' }}
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1

  e2e-test:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps

      - name: 📤 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: .next/

      - name: 🚀 Start application
        run: npm start &
        env:
          DATABASE_URL: 'mongodb://localhost:27017/numa-test'
          NEXT_PUBLIC_FIREBASE_API_KEY: 'mock-api-key'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'mock-project.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'mock-project'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'mock-project.appspot.com'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 'mock-app-id'

      - name: 🎭 Run E2E tests
        run: npm run test:e2e

      - name: 📤 Upload E2E test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run security audit
        run: npm audit --audit-level=high

      - name: 🔍 Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build]
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel Preview
        id: deploy
        run: |
          echo "url=https://numa-preview-${{ github.event.number }}.vercel.app" >> $GITHUB_OUTPUT
          echo "Preview deployment would be created here"

  deploy-production:
    name: 🌟 Deploy Production
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build, security]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://numa.vercel.app
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🌟 Deploy to Production
        run: |
          echo "Production deployment would be triggered here"
          echo "This could integrate with Vercel, AWS, or other platforms"

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: 📢 Notify team
        run: |
          echo "Deployment notification would be sent here"
          echo "This could integrate with Slack, Discord, or email"